<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Die Is To Live — Memento Mori App</title>
  <meta name="description" content="Visualize your life in months. Remember you will die. Live accordingly. Download the free iOS app.">
  <meta property="og:title" content="To Die Is To Live">
  <meta property="og:description" content="Visualize your life in months. Remember you will die. Live accordingly.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://todieisto.live">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cinzel', Georgia, serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .container {
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .skull-img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      opacity: 0.85;
      margin-bottom: 8px;
    }

    .live-aware {
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      font-weight: 700;
    }

    .title {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 3px;
      line-height: 1.1;
      margin: 4px 0;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 15px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 20px;
    }

    .app-store-btn {
      display: inline-block;
      transition: opacity 0.2s;
    }

    .app-store-btn:hover {
      opacity: 0.8;
    }

    .app-store-btn img {
      height: 54px;
    }

    .footer {
      margin-top: 40px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer a {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: rgba(255,255,255,0.6);
    }

    .footer .dot {
      color: rgba(255,255,255,0.2);
      font-size: 9px;
    }

    .copyright {
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="skull_bg.jpg" alt="Memento Mori" class="skull-img">

    <div class="live-aware">Live Aware</div>
    <div class="title">Memento<br>Mori</div>
    <div class="subtitle">To Die Is To Live</div>

    <div class="tagline">
      Visualize your life in months.<br>
      Remember you will die.<br>
      Live accordingly.
    </div>

    <!-- Replace # with your actual App Store URL once approved -->
    <a href="#" class="app-store-btn" id="appStoreLink">
      <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store">
    </a>

    <div class="footer">
      <a href="mailto:contact@legiounius.com">Contact</a>
      <span class="dot">&middot;</span>
      <a href="/privacy.html">Privacy</a>
      <span class="dot">&middot;</span>
      <a href="/terms.html">Terms</a>
    </div>

    <div class="copyright">Copyright Legio Unius MMXXVI</div>
  </div>
</body>
</html>
